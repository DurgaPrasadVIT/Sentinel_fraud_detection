# Local infrastructure for Sentinel: card memory (Redis) and the event stream (Kafka).
#   docker compose up -d      start both in the background
#   docker compose ps         check they are healthy
#   docker compose down       stop them (data is kept in volumes)
services:
  redis:
    image: redis:8
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]  # save to disk, survive restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Data is temporary: fine for local
    # development, since the decisions topic is only a stream of copies.
    image: apache/kafka:3.9.0
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  redis-data:
