# Sentinel, the whole system.
#
#   docker compose up -d                  Redis + Kafka only (run the Python services yourself)
#   docker compose --profile app up -d    + API, case service, ring detector, dashboard
#   docker compose --profile demo run --rm simulator     replay payments into the API
#   docker compose --profile app down     stop everything (case data is kept in a volume)
#
# Needs a trained model in ./models (python -m sentinel.train, then python -m sentinel.decisions)
# and, for the simulator, data in ./data/processed (python -m sentinel.data).

x-sentinel: &sentinel
  build: .
  image: sentinel:local
  environment:
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:19092            # Kafka's address inside Docker
    SENTINEL_CASES_DB: /app/cases/cases.db
  restart: unless-stopped

services:
  redis:
    image: redis:8
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]  # save to disk, survive restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners:
    #   localhost:9092  for programs on your laptop
    #   kafka:19092     for containers in this compose file
    image: apache/kafka:3.9.0
    container_name: sentinel-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: Q5oBtFAyQz2bCd1ZfZHJXg    # any 16-byte id, base64; fixed so restarts reuse the same cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    <<: *sentinel
    profiles: ["app"]
    container_name: sentinel-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro               # model + policy, deployed without a rebuild
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  cases:
    <<: *sentinel
    profiles: ["app"]
    container_name: sentinel-cases
    command: ["python", "-m", "sentinel.cases"]
    volumes:
      - cases:/app/cases
    healthcheck: {disable: true}
    depends_on:
      kafka: {condition: service_healthy}

  rings:
    <<: *sentinel
    profiles: ["app"]
    container_name: sentinel-rings
    command: ["python", "-m", "sentinel.rings"]
    healthcheck: {disable: true}
    depends_on:
      kafka: {condition: service_healthy}

  modelops:
    <<: *sentinel
    profiles: ["app"]
    container_name: sentinel-modelops
    command: ["python", "-m", "sentinel.modelops"]
    volumes:
      - ./models:/app/models:ro               # challenger + drift reference
      - cases:/app/cases
    healthcheck: {disable: true}
    depends_on:
      kafka: {condition: service_healthy}

  dashboard:
    <<: *sentinel
    profiles: ["app"]
    container_name: sentinel-dashboard
    command: ["streamlit", "run", "src/sentinel/dashboard.py",
              "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"
    volumes:
      - cases:/app/cases                      # same volume as the case service: SQLite WAL needs one filesystem
    healthcheck: {disable: true}

  simulator:
    <<: *sentinel
    profiles: ["demo"]
    restart: "no"
    command: ["python", "-m", "sentinel.simulator", "--url", "http://api:8000/score",
              "--rate", "50", "--limit", "3000", "--warmup-days", "3", "--attack", "--rings", "5"]
    volumes:
      - ./data/processed:/app/data/processed:ro
    healthcheck: {disable: true}

volumes:
  redis-data:
  cases:
