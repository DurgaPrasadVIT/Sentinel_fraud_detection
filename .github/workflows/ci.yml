name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      # The dataset and trained model are not in git (size, licence), so tests
      # that need them are skipped here and run locally. Everything else runs.
      - name: Test
        run: pytest -v -rs

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sentinel:ci .
      - name: Smoke test (imports and CLI inside the image)
        run: docker run --rm sentinel:ci python -c "import sentinel.api, sentinel.cases, sentinel.rings, sentinel.dashboard; print('ok')"
      # Runs like docker-compose: non-root user, fresh named volume. Catches
      # "unable to open database file" permission problems.
      - name: Smoke test (case database on a fresh volume)
        run: |
          docker volume create sentinel-ci-cases
          docker run --rm -v sentinel-ci-cases:/app/cases -e SENTINEL_CASES_DB=/app/cases/cases.db sentinel:ci \
            python -c "from sentinel.cases import CaseStore, CASES_DB; CaseStore(CASES_DB); print('case db ok:', CASES_DB)"
