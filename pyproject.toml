[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Real-time fraud and financial-crime detection platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern Python
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Evaluation data: full LLM notes on one line each, kept verbatim
"tests/test_note_guard_eval.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
